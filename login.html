<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login 🔐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      background: #020810;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #mountainCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Floating particles */
    .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .particle {
      position: absolute;
      bottom: -40px;
      font-size: 1rem;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.6; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* Card */
    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(15, 39, 68, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(74, 144, 217, 0.2);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      text-align: center;
      animation: cardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-icon { font-size: 3rem; margin-bottom: 0.5rem; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.1); }
    }

    .login-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      color: #7ec8f7;
      margin-bottom: 0.4rem;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: #6a9ab8;
      margin-bottom: 2rem;
      letter-spacing: 1px;
    }

    /* Form */
    .form-group { margin-bottom: 1.3rem; text-align: left; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #7ec8f7;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 1rem;
      font-size: 1rem;
      pointer-events: none;
    }
    .form-group input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(74,144,217,0.3);
      border-radius: 12px;
      color: #e0eaf5;
      font-size: 1rem;
      font-family: 'Lato', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }
    /* Username readonly styling */
    .form-group input[readonly] {
      color: #7ec8f7;
      cursor: not-allowed;
      background: rgba(74,144,217,0.08);
    }

    /* Show/hide password toggle */
    .toggle-pass {
      position: absolute;
      right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: #6a9ab8;
      padding: 0;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: #7ec8f7; }

    /* Error message */
    .error-msg {
      background: rgba(255, 80, 80, 0.12);
      border: 1px solid rgba(255,80,80,0.3);
      color: #ff8f8f;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
      animation: shake 0.4s ease;
    }
    .error-msg.show { display: block; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    /* Submit button */
    .btn-login {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #1a5fa8, #4a90d9);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 8px 25px rgba(74,144,217,0.35);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      margin-top: 0.5rem;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(74,144,217,0.5); }
    .btn-login:active { transform: scale(0.97); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Back link */
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.83rem;
      color: #5a8aaa;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #7ec8f7; }

    /* Success overlay */
    .success-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6,15,30,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .success-overlay.show { opacity: 1; pointer-events: all; }
    .success-overlay .emoji { font-size: 4rem; animation: bounceIn 0.5s ease; }
    .success-overlay h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #7ec8f7;
      margin: 1rem 0 0.5rem;
      animation: bounceIn 0.5s 0.1s ease both;
    }
    .success-overlay p {
      color: #a8c8e8;
      font-size: 1rem;
      animation: bounceIn 0.5s 0.2s ease both;
    }
    @keyframes bounceIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <canvas id="mountainCanvas"></canvas>

  <!-- Background particles -->
  <div class="bg-particles" id="bgParticles"></div>

  <!-- Login Card -->
  <div class="login-card">
    <div class="login-icon">💙</div>
    <h1 class="login-title">Masuk Yuk~</h1>
    <p class="login-subtitle">biar tau isi dari website nyooooooooo</p>

    <div class="error-msg" id="errorMsg">❌ Username atau password salah!</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <!-- Username (readonly) -->
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            value="Banana"
            readonly
            autocomplete="username"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            placeholder="Password nya hari Spesialmu"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pass" id="togglePass" onclick="togglePassword()" title="Tampilkan password">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">LOGIN</button>
    </form>

    <a href="index.html" class="back-link">← Kembali ke halaman utama</a>
  </div>

  <!-- Success Overlay -->
  <div class="success-overlay" id="successOverlay">
    <h2>Selamat Datang, Banana!</h2>
    <p>Sedang membuka halaman spesialmu...</p>
  </div>

  <!-- ===== ALERT MUSIK SELESAI ===== -->
  <div id="musikStopAlertLogin" style="
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  ">
    <div style="
      background: linear-gradient(135deg, #060f1e 0%, #0d2347 100%);
      border: 1.5px solid rgba(74,144,217,0.4);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: alertInLogin 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    ">
      <style>
        @keyframes alertInLogin {
          from { opacity: 0; transform: scale(0.85) translateY(20px); }
          to   { opacity: 1; transform: scale(1) translateY(0); }
        }
      </style>
      <div style="font-size:2.5rem;margin-bottom:0.8rem;">🎵</div>
      <h3 style="font-family:'Dancing Script',cursive;font-size:1.6rem;color:#7ec8f7;margin-bottom:0.7rem;">Musiknya Udah Selesai~</h3>
      <p style="color:#a8c8e8;font-size:0.88rem;line-height:1.6;margin-bottom:1.8rem;">
        Mau lanjut dengerin musik lagi,<br>atau lanjut tanpa musik?
      </p>
      <div style="display:flex;gap:1rem;justify-content:center;">
        <button onclick="lanjutMusik()" style="
          padding:0.75rem 1.5rem;
          background:linear-gradient(135deg,#1a5fa8,#4a90d9);
          border:none;border-radius:50px;color:#fff;
          font-size:0.88rem;font-family:'Lato',sans-serif;font-weight:700;
          cursor:pointer;box-shadow:0 4px 20px rgba(74,144,217,0.4);
          transition:transform 0.15s;
        ">🎵 Lanjut Musik</button>
        <button onclick="tanpaMusik()" style="
          padding:0.75rem 1.5rem;
          background:rgba(255,255,255,0.08);
          border:1.5px solid rgba(255,255,255,0.2);
          border-radius:50px;color:#a8c8e8;
          font-size:0.88rem;font-family:'Lato',sans-serif;
          cursor:pointer;
        ">Tanpa Musik</button>
      </div>
    </div>
  </div>

  <script>
    // ===== CREDENTIALS (defined in system) =====
    const CREDENTIALS = {
      username: 'Banana',
      password: '280206'
    };

    // ===== FLOATING PARTICLES =====
    (function () {
      const container = document.getElementById('bgParticles');
      const emojis = ['💙', '✨', '⭐', '💫', '🌊', '❄️'];
      function create() {
        const el = document.createElement('span');
        el.classList.add('particle');
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        const dur = 7 + Math.random() * 8;
        const delay = Math.random() * 4;
        el.style.animationDuration = dur + 's';
        el.style.animationDelay = delay + 's';
        el.style.fontSize = (0.6 + Math.random() * 0.9) + 'rem';
        container.appendChild(el);
        setTimeout(() => el.remove(), (dur + delay) * 1000);
      }
      for (let i = 0; i < 12; i++) create();
      setInterval(create, 800);
    })();

    // ===== TOGGLE PASSWORD VISIBILITY =====
    function togglePassword() {
      const input = document.getElementById('password');
      const btn = document.getElementById('togglePass');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    // ===== LOGIN HANDLER =====
    let attempts = 0;

    function handleLogin(e) {
      e.preventDefault();
      const enteredUser = document.getElementById('username').value.trim();
      const enteredPass = document.getElementById('password').value;
      const errorMsg    = document.getElementById('errorMsg');
      const btn         = document.getElementById('loginBtn');

      // Validate
      if (enteredUser === CREDENTIALS.username && enteredPass === CREDENTIALS.password) {
        // Success
        errorMsg.classList.remove('show');
        btn.disabled = true;
        btn.textContent = '✅ Berhasil!';

        setTimeout(() => {
          document.getElementById('successOverlay').classList.add('show');
        }, 400);

        // Redirect after short delay
        setTimeout(() => {
          window.location.href = 'pesan.html';
        }, 2200);

      } else {
        // Fail
        attempts++;
        errorMsg.classList.remove('show');
        // Force re-trigger animation
        void errorMsg.offsetWidth;
        errorMsg.classList.add('show');

        if (attempts >= 3) {
          errorMsg.textContent = `❌ Salah lagi? Masa lupa password sendiri 😅 (percobaan ke-${attempts})`;
        } else {
          errorMsg.textContent = '❌ Username atau password salah!';
        }

        // Shake the card
        const card = document.querySelector('.login-card');
        card.style.animation = 'none';
        void card.offsetWidth;
        card.style.animation = '';

        // Clear password
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }

    window.addEventListener('load', () => {
      document.getElementById('password').focus();
      // Resume music on first user interaction (browser blocks autoplay without gesture)
      function resumeOnInteraction() {
        Music.resume();
        document.removeEventListener('click', resumeOnInteraction);
        document.removeEventListener('keydown', resumeOnInteraction);
      }
      if (localStorage.getItem('musikAktif') === 'ya') {
        document.addEventListener('click', resumeOnInteraction);
        document.addEventListener('keydown', resumeOnInteraction);
      }
    });
  </script>
  <script src="music.js"></script>
  <script>
  (function() {
    var canvas = document.getElementById('mountainCanvas');
    var ctx = canvas.getContext('2d');
    var W, H, mouseX = -1000, mouseY = -1000;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
    }
    resize();
    window.addEventListener('resize', resize);

    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    document.addEventListener('mouseleave', function() {
      mouseX = -1000; mouseY = -1000;
    });

    var stars = [];
    for (var i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * 3000,
        y: Math.random() * 2000,
        r: 0.3 + Math.random() * 1.8,
        twinkle: Math.random() * Math.PI * 2,
        speed: 0.2 + Math.random() * 2,
        parallax: 0.01 + Math.random() * 0.04
      });
    }

    function genMountain(peaks, baseY, variance, roughness) {
      var pts = [];
      var segW = W / (peaks * 20);
      var x = 0;
      var y = baseY;
      for (var i = 0; i <= peaks * 20; i++) {
        y += (Math.random() - 0.5) * roughness;
        y = Math.max(baseY - variance, Math.min(baseY + roughness * 2, y));
        if (i % 20 === 10) {
          y -= variance * (0.4 + Math.random() * 0.6);
        }
        pts.push({ x: x, y: y });
        x += segW;
      }
      pts.push({ x: W + 10, y: baseY + 50 });
      pts.push({ x: -10, y: baseY + 50 });
      return pts;
    }

    var mtnBack, mtnMid, mtnFront;
    function buildMountains() {
      mtnBack  = genMountain(3, H * 0.58, H * 0.18, 20);
      mtnMid   = genMountain(2, H * 0.68, H * 0.14, 25);
      mtnFront = genMountain(2, H * 0.78, H * 0.1, 18);
    }
    buildMountains();
    window.addEventListener('resize', buildMountains);

    var shootingStars = [];
    setInterval(function() {
      if (shootingStars.length > 1) return;
      var fromLeft = Math.random() > 0.5;
      shootingStars.push({
        x: fromLeft ? Math.random() * W * 0.3 : W - Math.random() * W * 0.3,
        y: Math.random() * H * 0.35,
        len: 70 + Math.random() * 100,
        speed: 5 + Math.random() * 6,
        angle: fromLeft ? Math.PI / 4 + (Math.random()-0.5)*0.3 : 3*Math.PI/4 + (Math.random()-0.5)*0.3,
        life: 1,
        decay: 0.012 + Math.random() * 0.008
      });
    }, 6000);

    function drawMountain(pts, fillColor, shadowColor) {
      ctx.save();
      if (shadowColor) {
        ctx.shadowColor = shadowColor;
        ctx.shadowBlur = 30;
      }
      ctx.fillStyle = fillColor;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length - 2; i++) {
        var xc = (pts[i].x + pts[i+1].x) / 2;
        var yc = (pts[i].y + pts[i+1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
      }
      var last = pts[pts.length - 3];
      ctx.lineTo(last.x, last.y);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawMoon(t) {
      var r = Math.min(W, H) * 0.06;
      var mx = W * 0.85;
      var my = H * 0.16;
      var pulse = 1 + Math.sin(t * 0.0008) * 0.03;
      r *= pulse;

      ctx.save();
      ctx.shadowColor = 'rgba(255,250,200,0.5)';
      ctx.shadowBlur = 80;
      ctx.beginPath();
      ctx.arc(mx, my, r, 0, Math.PI * 2);
      var mg = ctx.createRadialGradient(mx - r*0.3, my - r*0.3, r*0.1, mx, my, r);
      mg.addColorStop(0, '#fffbe6');
      mg.addColorStop(0.5, '#ffeeb3');
      mg.addColorStop(1, '#ffd54f');
      ctx.fillStyle = mg;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(255,250,200,0.15)';
      ctx.shadowBlur = 100;
      ctx.beginPath();
      ctx.arc(mx, my, r * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,250,220,0.05)';
      ctx.fill();
      ctx.restore();

      var eyeX = r * 0.25, eyeY = r * 0.1, eyeR = r * 0.06;
      ctx.fillStyle = '#5d4e37';
      ctx.beginPath(); ctx.arc(mx - eyeX, my - eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx + eyeX, my - eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5d4e37'; ctx.lineWidth = r * 0.035; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(mx, my + r * 0.08, r * 0.3, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,170,140,0.25)';
      ctx.beginPath(); ctx.ellipse(mx - eyeX - r*0.05, my + r*0.17, r*0.1, r*0.06, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(mx + eyeX + r*0.05, my + r*0.17, r*0.1, r*0.06, 0.2, 0, Math.PI*2); ctx.fill();
    }

    function drawStars(t) {
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var bx = (s.x / 3000) * W;
        var by = (s.y / 2000) * H;
        var dx = 0, dy = 0;
        if (mouseX > 0) {
          dx = (mouseX - W/2) * s.parallax;
          dy = (mouseY - H/2) * s.parallax;
        }
        var sx = bx + dx, sy = by + dy;
        var twinkle = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.001 * s.speed + s.twinkle));
        var dist = Math.sqrt((sx-mouseX)*(sx-mouseX) + (sy-mouseY)*(sy-mouseY));
        var glow = dist < 120 ? (1 - dist/120) * 0.6 : 0;
        ctx.save();
        if (glow > 0) {
          ctx.shadowColor = 'rgba(200,220,255,' + glow + ')';
          ctx.shadowBlur = 16;
        }
        ctx.globalAlpha = twinkle * (0.6 + glow * 0.4);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx, sy, s.r + glow * 1.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawShootingStars() {
      for (var i = shootingStars.length - 1; i >= 0; i--) {
        var ss = shootingStars[i];
        ss.x += Math.cos(ss.angle) * ss.speed;
        ss.y += Math.sin(ss.angle) * ss.speed;
        ss.life -= ss.decay;
        if (ss.life <= 0 || ss.x < -150 || ss.x > W+150 || ss.y < -150 || ss.y > H+150) {
          shootingStars.splice(i, 1); continue;
        }
        var tx = ss.x - Math.cos(ss.angle) * ss.len * ss.life;
        var ty = ss.y - Math.sin(ss.angle) * ss.len * ss.life;
        var grad = ctx.createLinearGradient(tx, ty, ss.x, ss.y);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(0.7, 'rgba(180,210,255,' + ss.life*0.5 + ')');
        grad.addColorStop(1, 'rgba(255,255,255,' + ss.life + ')');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(ss.x, ss.y); ctx.stroke();
        ctx.save();
        ctx.globalAlpha = ss.life;
        ctx.shadowColor = '#aaccff';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ss.x, ss.y, 1.8, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }

    function drawMist(t) {
      ctx.save();
      for (var i = 0; i < 3; i++) {
        var mx = (W * 0.2 * i + t * 0.005 * (i+1)) % (W * 1.5) - W * 0.25;
        var my = H * 0.62 + i * H * 0.06;
        var mw = W * 0.4;
        var grad = ctx.createRadialGradient(mx, my, 0, mx, my, mw);
        grad.addColorStop(0, 'rgba(120,160,200,0.04)');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(mx - mw, my - mw * 0.3, mw * 2, mw * 0.6);
      }
      ctx.restore();
    }

    function drawCursorGlow() {
      if (mouseX < 0) return;
      ctx.save();
      var cg = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 160);
      cg.addColorStop(0, 'rgba(120,170,255,0.07)');
      cg.addColorStop(0.5, 'rgba(100,150,255,0.03)');
      cg.addColorStop(1, 'transparent');
      ctx.fillStyle = cg;
      ctx.fillRect(mouseX-160, mouseY-160, 320, 320);
      ctx.restore();
    }

    function drawNebula() {
      ctx.save();
      ctx.globalAlpha = 0.04;
      var ng = ctx.createRadialGradient(W*0.3, H*0.2, 0, W*0.3, H*0.2, W*0.3);
      ng.addColorStop(0, '#4a6cf7');
      ng.addColorStop(1, 'transparent');
      ctx.fillStyle = ng;
      ctx.fillRect(0, 0, W, H);
      var ng2 = ctx.createRadialGradient(W*0.75, H*0.15, 0, W*0.75, H*0.15, W*0.25);
      ng2.addColorStop(0, '#9b59b6');
      ng2.addColorStop(1, 'transparent');
      ctx.fillStyle = ng2;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    function render(t) {
      ctx.clearRect(0, 0, W, H);
      var bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#020810');
      bg.addColorStop(0.35, '#060e1f');
      bg.addColorStop(0.65, '#0a1628');
      bg.addColorStop(1, '#0d1f3c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      drawNebula();
      drawCursorGlow();
      drawStars(t);
      drawMoon(t);
      drawShootingStars();

      drawMountain(mtnBack,  '#070e1a', null);
      drawMist(t);
      drawMountain(mtnMid,   '#050b15', 'rgba(0,0,0,0.3)');
      drawMountain(mtnFront, '#030810', 'rgba(0,0,0,0.5)');

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  })();
  </script>
</body>
</html>
