<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login 🔐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #060f1e 0%, #0d2347 50%, #1a3a6b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Floating particles */
    .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .particle {
      position: absolute;
      bottom: -40px;
      font-size: 1rem;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.6; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* Card */
    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(15, 39, 68, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(74, 144, 217, 0.2);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      text-align: center;
      animation: cardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-icon { font-size: 3rem; margin-bottom: 0.5rem; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.1); }
    }

    .login-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      color: #7ec8f7;
      margin-bottom: 0.4rem;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: #6a9ab8;
      margin-bottom: 2rem;
      letter-spacing: 1px;
    }

    /* Form */
    .form-group { margin-bottom: 1.3rem; text-align: left; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #7ec8f7;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 1rem;
      font-size: 1rem;
      pointer-events: none;
    }
    .form-group input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(74,144,217,0.3);
      border-radius: 12px;
      color: #e0eaf5;
      font-size: 1rem;
      font-family: 'Lato', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
    }
    /* Username readonly styling */
    .form-group input[readonly] {
      color: #7ec8f7;
      cursor: not-allowed;
      background: rgba(74,144,217,0.08);
    }

    /* Show/hide password toggle */
    .toggle-pass {
      position: absolute;
      right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: #6a9ab8;
      padding: 0;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: #7ec8f7; }

    /* Error message */
    .error-msg {
      background: rgba(255, 80, 80, 0.12);
      border: 1px solid rgba(255,80,80,0.3);
      color: #ff8f8f;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
      animation: shake 0.4s ease;
    }
    .error-msg.show { display: block; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    /* Submit button */
    .btn-login {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #1a5fa8, #4a90d9);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 8px 25px rgba(74,144,217,0.35);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      margin-top: 0.5rem;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(74,144,217,0.5); }
    .btn-login:active { transform: scale(0.97); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Back link */
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.83rem;
      color: #5a8aaa;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #7ec8f7; }

    /* Success overlay */
    .success-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6,15,30,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .success-overlay.show { opacity: 1; pointer-events: all; }
    .success-overlay .emoji { font-size: 4rem; animation: bounceIn 0.5s ease; }
    .success-overlay h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #7ec8f7;
      margin: 1rem 0 0.5rem;
      animation: bounceIn 0.5s 0.1s ease both;
    }
    .success-overlay p {
      color: #a8c8e8;
      font-size: 1rem;
      animation: bounceIn 0.5s 0.2s ease both;
    }
    @keyframes bounceIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Background particles -->
  <div class="bg-particles" id="bgParticles"></div>

  <!-- Login Card -->
  <div class="login-card">
    <div class="login-icon">💙</div>
    <h1 class="login-title">Masuk Yuk~</h1>
    <p class="login-subtitle">biar tau isi dari website nyooooooooo</p>

    <div class="error-msg" id="errorMsg">❌ Username atau password salah!</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <!-- Username (readonly) -->
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            value="Banana"
            readonly
            autocomplete="username"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            placeholder="Password nya hari Spesialmu"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pass" id="togglePass" onclick="togglePassword()" title="Tampilkan password">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">LOGIN</button>
    </form>

    <a href="index.html" class="back-link">← Kembali ke halaman utama</a>
  </div>

  <!-- Success Overlay -->
  <div class="success-overlay" id="successOverlay">
    <h2>Selamat Datang, Banana!</h2>
    <p>Sedang membuka halaman spesialmu...</p>
  </div>

  <!-- ===== ALERT MUSIK SELESAI ===== -->
  <div id="musikStopAlertLogin" style="
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  ">
    <div style="
      background: linear-gradient(135deg, #060f1e 0%, #0d2347 100%);
      border: 1.5px solid rgba(74,144,217,0.4);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: alertInLogin 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    ">
      <style>
        @keyframes alertInLogin {
          from { opacity: 0; transform: scale(0.85) translateY(20px); }
          to   { opacity: 1; transform: scale(1) translateY(0); }
        }
      </style>
      <div style="font-size:2.5rem;margin-bottom:0.8rem;">🎵</div>
      <h3 style="font-family:'Dancing Script',cursive;font-size:1.6rem;color:#7ec8f7;margin-bottom:0.7rem;">Musiknya Udah Selesai~</h3>
      <p style="color:#a8c8e8;font-size:0.88rem;line-height:1.6;margin-bottom:1.8rem;">
        Mau lanjut dengerin musik lagi,<br>atau lanjut tanpa musik?
      </p>
      <div style="display:flex;gap:1rem;justify-content:center;">
        <button onclick="lanjutMusik()" style="
          padding:0.75rem 1.5rem;
          background:linear-gradient(135deg,#1a5fa8,#4a90d9);
          border:none;border-radius:50px;color:#fff;
          font-size:0.88rem;font-family:'Lato',sans-serif;font-weight:700;
          cursor:pointer;box-shadow:0 4px 20px rgba(74,144,217,0.4);
          transition:transform 0.15s;
        ">🎵 Lanjut Musik</button>
        <button onclick="tanpaMusik()" style="
          padding:0.75rem 1.5rem;
          background:rgba(255,255,255,0.08);
          border:1.5px solid rgba(255,255,255,0.2);
          border-radius:50px;color:#a8c8e8;
          font-size:0.88rem;font-family:'Lato',sans-serif;
          cursor:pointer;
        ">Tanpa Musik</button>
      </div>
    </div>
  </div>

  <script>
    // ===== CREDENTIALS (defined in system) =====
    const CREDENTIALS = {
      username: 'Banana',
      password: '280206'
    };

    // ===== FLOATING PARTICLES =====
    (function () {
      const container = document.getElementById('bgParticles');
      const emojis = ['💙', '✨', '⭐', '💫', '🌊', '❄️'];
      function create() {
        const el = document.createElement('span');
        el.classList.add('particle');
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        const dur = 7 + Math.random() * 8;
        const delay = Math.random() * 4;
        el.style.animationDuration = dur + 's';
        el.style.animationDelay = delay + 's';
        el.style.fontSize = (0.6 + Math.random() * 0.9) + 'rem';
        container.appendChild(el);
        setTimeout(() => el.remove(), (dur + delay) * 1000);
      }
      for (let i = 0; i < 12; i++) create();
      setInterval(create, 800);
    })();

    // ===== TOGGLE PASSWORD VISIBILITY =====
    function togglePassword() {
      const input = document.getElementById('password');
      const btn = document.getElementById('togglePass');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    // ===== LOGIN HANDLER =====
    let attempts = 0;

    function handleLogin(e) {
      e.preventDefault();
      const enteredUser = document.getElementById('username').value.trim();
      const enteredPass = document.getElementById('password').value;
      const errorMsg    = document.getElementById('errorMsg');
      const btn         = document.getElementById('loginBtn');

      // Validate
      if (enteredUser === CREDENTIALS.username && enteredPass === CREDENTIALS.password) {
        // Success
        errorMsg.classList.remove('show');
        btn.disabled = true;
        btn.textContent = '✅ Berhasil!';

        setTimeout(() => {
          document.getElementById('successOverlay').classList.add('show');
        }, 400);

        // Redirect after short delay
        setTimeout(() => {
          window.location.href = 'pesan.html';
        }, 2200);

      } else {
        // Fail
        attempts++;
        errorMsg.classList.remove('show');
        // Force re-trigger animation
        void errorMsg.offsetWidth;
        errorMsg.classList.add('show');

        if (attempts >= 3) {
          errorMsg.textContent = `❌ Salah lagi? Masa lupa password sendiri 😅 (percobaan ke-${attempts})`;
        } else {
          errorMsg.textContent = '❌ Username atau password salah!';
        }

        // Shake the card
        const card = document.querySelector('.login-card');
        card.style.animation = 'none';
        void card.offsetWidth;
        card.style.animation = '';

        // Clear password
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }

    window.addEventListener('load', () => {
      document.getElementById('password').focus();
      Music.resume();
    });
  </script>
  <script src="music.js"></script>
</body>
</html>
